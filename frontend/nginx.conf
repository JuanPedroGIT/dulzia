server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-XSS-Protection "1; mode=block" always;

  # Gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # ── Redirects 301 de la web antigua (WordPress) ────────────────────────
  # Conservan el SEO acumulado: las URLs antiguas apuntan a las nuevas.
  location = /quienes-somos/ { return 301 /nosotros; }
  location = /quienes-somos  { return 301 /nosotros; }
  location = /tienda/        { return 301 /servicios/regalos-personalizados; }
  location = /tienda         { return 301 /servicios/regalos-personalizados; }
  location = /servicios/     { return 301 /servicios; }
  location = /servicios/carrito-de-perritos-calientes/ { return 301 /servicios/carrito-hot-dog; }
  location = /servicios/photocall-y-decoraciones/      { return 301 /servicios/photocall; }
  location = /servicios/picnic-y-tipis/                { return 301 /servicios/picnic-tipis; }
  location = /servicios/fuente-de-chocolate/           { return 301 /servicios/fuente-chocolate; }
  location = /servicios/candy-bar/                     { return 301 /servicios/candy-bar; }
  location = /servicios/carteles-de-bienvenida/        { return 301 /servicios/carteles-bienvenida; }
  location = /servicios/mini-ferias/                   { return 301 /servicios/mini-ferias; }
  location = /servicios/palomitero/                    { return 301 /servicios/palomitero; }
  location = /servicios/algodon-de-azucar/             { return 301 /servicios/algodon-azucar; }
  location = /servicios/glitter-bar/                   { return 301 /servicios/glitter-bar; }
  location = /servicios/regalos-personalizados/        { return 301 /servicios/regalos-personalizados; }
  location = /contacto/                { return 301 /contacto; }
  location = /aviso-legal/             { return 301 /aviso-legal; }
  location = /politica-de-privacidad/  { return 301 /politica-de-privacidad; }

  # Static assets
  location ~* \.(js|css|woff2|woff|ttf|png|jpg|jpeg|gif|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }
}
