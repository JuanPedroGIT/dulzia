parameters:
    # Emails del formulario de contacto — valores por defecto en backend/.env
    # (versionable) y sobreescritura sin rebuild desde el .env raíz
    # (env_file del compose, que tiene prioridad sobre backend/.env).
    mailer.to_email: '%env(MAILER_TO_EMAIL)%'
    mailer.to_name: '%env(MAILER_TO_NAME)%'
    mailer.from_email: '%env(MAILER_FROM_EMAIL)%'
    mailer.from_name: '%env(MAILER_FROM_NAME)%'
    mailer.confirm_from_email: '%env(MAILER_CONFIRM_FROM_EMAIL)%'
    mailer.confirm_from_name: '%env(MAILER_CONFIRM_FROM_NAME)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Puertos del dominio → adaptadores de infraestructura
    Psr\Log\LoggerInterface: '@App\Infrastructure\Log\StderrLogger'
    App\Domain\Contact\MailerInterface: '@App\Infrastructure\Email\BrevoMailer'
    App\Domain\Contact\ContactRepositoryInterface: '@App\Infrastructure\Repository\DoctrineContactRepository'
    App\Domain\Admin\AdminUserRepositoryInterface: '@App\Infrastructure\Repository\DoctrineAdminUserRepository'
    App\Domain\Admin\AdminTokenStoreInterface: '@App\Infrastructure\Security\DatabaseAdminTokenStore'
    App\Domain\Service\ServiceRepositoryInterface: '@App\Infrastructure\Repository\DoctrineServiceRepository'
    App\Domain\Service\ServiceExampleRepositoryInterface: '@App\Infrastructure\Repository\DoctrineServiceExampleRepository'
    App\Domain\Category\CategoryRepositoryInterface: '@App\Infrastructure\Repository\DoctrineCategoryRepository'
    App\Domain\Storage\FileStorageInterface: '@App\Infrastructure\Storage\CloudflareR2Storage'
    App\Domain\Settings\SettingsRepositoryInterface: '@App\Infrastructure\Repository\DoctrineSettingsRepository'

    App\Domain\Settings\ContactRecipientResolver:
        arguments:
            # Respaldo cuando el panel no tiene nada configurado: los parámetros
            # de arriba, que a su vez salen del .env raíz.
            $defaultEmail: '%mailer.to_email%'
            $defaultName: '%mailer.to_name%'

    App\Infrastructure\Email\BrevoMailer:
        arguments:
            $apiKey: '%env(BREVO_API_KEY)%'
            $fromEmail: '%mailer.from_email%'
            $fromName: '%mailer.from_name%'
            $confirmFromEmail: '%mailer.confirm_from_email%'
            $confirmFromName: '%mailer.confirm_from_name%'

    App\Infrastructure\Storage\CloudflareR2Storage:
        arguments:
            $accountId: '%env(R2_ACCOUNT_ID)%'
            $accessKeyId: '%env(R2_ACCESS_KEY_ID)%'
            $accessKeySecret: '%env(R2_ACCESS_KEY_SECRET)%'
            $bucket: '%env(R2_BUCKET_NAME)%'
            $publicUrl: '%env(R2_PUBLIC_URL)%'

    # Conservado para rollback rápido: volver el alias de arriba a LocalFileStorage
    App\Infrastructure\Storage\LocalFileStorage:
        arguments:
            $uploadDir: '%kernel.project_dir%/public/uploads/services'
            $baseUrl: '%env(APP_URL)%'
